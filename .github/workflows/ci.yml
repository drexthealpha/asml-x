# ASML-X CI. Every gate here can fail the build. Nothing is advisory.
#
# WHAT IS PINNED AND WHY. Action majors move, runner images change under `ubuntu-latest`, and
# toolchains drift. A pipeline that floats produces a green meaning "it passed against whatever
# existed today", which is not a claim anyone can check later. So the runner image, every action and
# every toolchain carries an explicit version.
#
# THERE IS ONE THING CI DOES NOT DO, and it is not a skipped gate. The deployer keystore holding real
# OKB on chain 196 never enters CI, because a funded key in repository secrets is one compromised
# action away from being drained. Everything that key would have done is done instead by `anvil` with
# a throwaway account on a local chain: real deploys, real transactions, real settlement, real
# receipts. The mainnet CLAIMS are separately re-verified read-only against chain 196 in the
# `live-chain` job, which needs no key at all.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.97.1"
  FOUNDRY_VERSION: "1.7.1"
  GITLEAKS_VERSION: "8.30.1"
  HALMOS_VERSION: "0.3.3"
  NODE_VERSION: "20.19.4"
  PNPM_VERSION: "10.34.5"
  CARGO_TERM_COLOR: never

jobs:
  rust:
    name: rust (fmt, clippy, build, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt
          rustup default "${RUST_VERSION}"
          rustc --version
      - uses: actions/cache@v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
      - name: cargo fmt --check
        run: cargo fmt --all --check
      # --all-targets covers tests too. A tautological assertion in a test file was found exactly
      # this way in this repo, by clippy's identity_op, and it had been guarding a shipped bug.
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo build
        run: cargo build --workspace --locked
      - name: cargo test
        run: cargo test --workspace --locked

  contracts:
    name: contracts (forge build, forge test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      # forge-std is vendored under contracts/lib and tracked, so a clean clone needs no submodules.
      - uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: forge build
        working-directory: contracts
        run: forge build
      - name: forge test
        working-directory: contracts
        run: forge test --color never -vv

      # CARRIED OVER FROM THE PREVIOUS WORKFLOW, which this file replaced. A suite that runs zero
      # tests exits 0, so "forge test passed" and "forge test proved something" are different
      # claims. The floor is raised from the original 40 to 100: the suite currently runs 113, and a
      # threshold far below the real count stops catching a suite that quietly shrinks.
      - name: Assert the suite was not vacuous
        working-directory: contracts
        run: |
          COUNT=$(forge test --color never 2>&1 | grep -oE '[0-9]+ tests passed' | tail -1 | awk '{print $1}')
          echo "tests passed: ${COUNT:-0}"
          if [ "${COUNT:-0}" -lt 100 ]; then
            echo "Too few tests ran (${COUNT:-0}). Treating as a failure."
            exit 1
          fi

  formal:
    name: formal (halmos theorems)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install pinned halmos and the Yices solver
        run: |
          uv tool install "halmos==${HALMOS_VERSION}"
          halmos --version
          # YICES, NOT Z3. `check_unconfiguredMarketAlwaysFailsClosed` passes locally under Z3 and
          # returned [ERROR] on this runner with "Error queries saved in ...", which is a solver
          # failure rather than a counterexample. halmos' own CI moved off Z3 for the same reason
          # and its FAQ recommends Yices as the default. Measured here: 6 passed / 1 error under Z3
          # became 7 passed in 2.97s under Yices. The theorems and bounds are unchanged.
          sudo apt-get update -qq
          sudo apt-get install -y -qq yices2 || {
            echo "apt yices2 unavailable, letting halmos fetch it"
            halmos --solver yices --help > /dev/null 2>&1 || true
          }
          command -v yices-smt2 && yices-smt2 --version | head -1 || echo "yices resolved by halmos"
      # ALL FIVE theorem scripts run. Three of them used `--solver-timeout-assertion 0`, which is
      # unlimited, and were going to be excluded for that reason. They now carry the same finite
      # per-theorem timeout and wall-clock wrapper the other two already had, which was a two-line
      # fix per script. Excluding a gate is not a substitute for fixing it.
      - name: Risk guard theorems
        run: bash scripts/15-formal-verification.sh
      - name: Risk guard proof mutation
        run: bash scripts/16-proof-mutation.sh
      - name: RWA theorems
        run: bash scripts/21-rwa-formal.sh
      - name: Fee theorems
        run: bash scripts/104b-fee-formal.sh
      - name: Vault theorems
        run: bash scripts/112e-vault-formal.sh

  mutation:
    name: mutation (invariants, crossed book)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
      - uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Vault invariant mutation
        run: bash scripts/166-vault-invariants.sh
      - name: Crossed-book mutation
        run: bash scripts/195-crossed-book-mutation.sh

  # ---------------------------------------------------------------------------
  # Deploy, trade and settle. These were the "needs a funded key" gates.
  # ---------------------------------------------------------------------------
  onchain:
    name: onchain (anvil, real transactions)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
      - uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Build the runtime
        run: cargo build --release --locked -p runtime
      # anvil with chain id 1952 and its publicly known account 0, which funds nothing anywhere.
      # scripts/lib.sh reads every endpoint, address and key path from the environment, so the SAME
      # gate scripts run here as against real testnet, unmodified.
      - name: Start local chain
        run: bash scripts/196-ci-anvil-up.sh
      - name: Deploy, seed, and run the agent
        run: bash scripts/197-ci-onchain-gates.sh

  # ---------------------------------------------------------------------------
  # Read-only verification against the real chains. No key, so nothing here can spend.
  # ---------------------------------------------------------------------------
  live-chain:
    name: live-chain (read-only, real X Layer)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # A public RPC can be briefly unavailable, and a gate that reddens on someone else's outage
      # gets ignored. Retried three times rather than dropped: a persistent failure still fails.
      - name: Mainnet claims, re-verified from chain 196
        run: |
          for attempt in 1 2 3; do
            if bash scripts/184-mainnet-reverify.sh; then exit 0; fi
            echo "attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          echo "mainnet re-verification failed three times"
          exit 1

  frontend:
    name: frontend (typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned pnpm
        run: npm install -g "pnpm@${PNPM_VERSION}"
      - name: Install dependencies
        working-directory: ui-v2
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        working-directory: ui-v2
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Browser gates, headless. E11 is about this project's preview pane, NOT about headless Chromium,
  # and treating it as a universal limit was how these came to be skipped.
  # ---------------------------------------------------------------------------
  browser:
    name: browser (dashboard, density, failure paths)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned pnpm
        run: npm install -g "pnpm@${PNPM_VERSION}"
      - name: Build the UI
        working-directory: ui-v2
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install Playwright
        working-directory: ci/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Install pinned Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
      - uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Build the runtime and the coordination API
        run: cargo build --release --locked -p runtime -p coordination-api
      # ONE SCRIPT STANDS UP THE WHOLE ENVIRONMENT, because the pieces have to agree about which
      # chain they are on. The first version of this job started only the coordination API and the
      # static server, and the failure-path audit then failed on
      # `POST http://localhost:4177 :: ERR_CONNECTION_REFUSED`: the audit sends a REAL transaction
      # through the injected provider, which posts to the signer, which was not running. The app
      # correctly reported a network problem and the audit correctly refused it, so two gates failed
      # for one missing service.
      #
      # scripts/202 starts a local chain, deploys the full contract set onto it, points the built
      # UI's manifest at those addresses, funds and starts the signer, starts the coordination API
      # on the same chain, serves the UI, and only then runs the gates.
      - name: Stand up the environment and run the browser gates
        run: bash scripts/202-ci-browser-env.sh

  # CARRIED OVER FROM THE PREVIOUS WORKFLOW. The external agent is an integration client needing a
  # live chain and a running server, so a compile check is the honest limit of what CI can assert
  # about it. Dropping the job would have removed the only thing standing between a syntax error and
  # the example another builder copies.
  python:
    name: python (external agent, examples)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"
      - name: Compile check
        run: |
          python3 -m py_compile agents/external_agent.py
          python3 -m py_compile examples/python_client.py
          # Every gate script this workflow runs is Python or shell; a syntax error in one is a
          # broken gate, so they are compile-checked too.
          python3 -m py_compile scripts/181-repro-inventory.py scripts/187-claim-tags.py \
            scripts/185-fake-win-register.py scripts/199-validate-workflow.py \
            scripts/201-ci-ui-manifest-local.py scripts/203-gitleaks-triage.py

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # CARRIED OVER FROM THE PREVIOUS WORKFLOW. gitleaks looks at CONTENT; this looks at NAMES, and
      # they fail differently. A tracked file called `deployer.keystore` that happens to contain
      # nothing gitleaks recognises would pass a content scan and still be the exact mistake this
      # project must never make.
      - name: No key material tracked by name
        run: |
          # `evidence/phase0/secret-scanner-install.md` is excluded by name: it is the write-up of
          # INSTALLING gitleaks and contains no key-shaped strings, verified separately. Excluding
          # one named documentation file is narrower than loosening the pattern, which would let a
          # real `secrets.json` through.
          BAD=$(git ls-files \
            | grep -iE 'keystore|\.env$|\.pass$|id_rsa|secret' \
            | grep -v '\.example$' \
            | grep -v '^evidence/phase0/secret-scanner-install\.md$' || true)
          if [ -n "$BAD" ]; then
            echo "Secret-looking files are tracked:"
            echo "$BAD"
            exit 1
          fi
          echo "No key material tracked."
      # The binary, not gitleaks-action: v2 of that action needs a paid licence for organisation
      # repos, and a licence key is a dependency this gate does not need.
      - name: Install pinned gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # --config keeps the DEFAULT ruleset and adds an allowlist that names each permitted value:
      # anvil's published account 0, the public coordination demo keys, and gitignored build output
      # whose dependencies ship key-shaped test vectors. scripts/204-gitleaks-mutation.sh proves the
      # allowlist did not blind the gate by planting a freshly generated key and requiring a catch.
      - name: Scan full history
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --exit-code 1
      # --no-git scans the filesystem, so it sees untracked files a history scan never reaches.
      - name: Scan working tree
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --no-banner --redact --exit-code 1
      # The gate must be able to fail. An allowlist is exactly how a secret scanner gets quietly
      # disabled, so this is checked on every run rather than trusted.
      - name: Prove the allowlist still catches a real secret
        run: bash scripts/204-gitleaks-mutation.sh

  evidence:
    name: evidence (chain integrity)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"
      # Refuses on a malformed row, a duplicate claim id, a claim with no command, a missing or
      # empty evidence file, or a cited script that does not exist. All five were real defects
      # found in this repo's own chain.
      - name: Chain inventory
        run: python3 scripts/181-repro-inventory.py
      - name: Claim tags resolve
        run: python3 scripts/187-claim-tags.py
      - name: Chain of evidence
        run: bash scripts/44-chain-verify.sh --dry
